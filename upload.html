<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Resume | ImmXrsive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 40px 20px;
      background-image: 
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }
    .container { max-width: 700px; margin: 0 auto; }
    .back-link {
      display: inline-block;
      margin-bottom: 24px;
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 32px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }
    h1 { font-size: 2rem; margin-bottom: 12px; }
    p { color: var(--text-muted); margin-bottom: 24px; line-height: 1.5; }
    
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 24px;
      background: rgba(15, 23, 42, 0.5);
      transition: border-color 0.2s ease;
    }
    .upload-zone:hover { border-color: var(--primary); }
    
    input[type="file"] {
      display: block;
      margin: 0 auto 16px auto;
      color: var(--text-muted);
    }
    
    button {
      width: 100%;
      background: var(--primary);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }
    button:hover { background: var(--primary-hover); }
    button:disabled { background: var(--border); cursor: not-allowed; }

    #resultBox {
      margin-top: 24px;
      display: none;
    }
    pre {
      background: #0f172a;
      padding: 16px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: #94a3b8;
      font-family: monospace;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-size: 0.9rem;
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="index.html" class="back-link">&larr; Back to Directory</a>
    <div class="card">
      <h1>Add Student Profile</h1>
      <p>Upload a PDF resume. The system will securely parse the text and prepare the profile data for the directory.</p>
      
      <form id="uploadForm">
        <div class="upload-zone">
          <input type="file" id="resumeFile" accept="application/pdf" required>
        </div>
        <button type="submit" id="submitBtn">Parse Resume</button>
      </form>

      <div id="resultBox">
        <h3 style="margin-bottom: 12px; font-size: 1.1rem;">Parsed Output:</h3>
        <pre id="parsedContent"></pre>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('resumeFile');
      const submitBtn = document.getElementById('submitBtn');
      const resultBox = document.getElementById('resultBox');
      const parsedContent = document.getElementById('parsedContent');
      
      const file = fileInput.files[0];
      if (!file) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Parsing...';
      resultBox.style.display = 'block';
      parsedContent.textContent = 'Uploading to secure extraction service...';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('https://immxrsive-api.onrender.com/api/resumes/parse', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        // The text is already HTML escaped by the backend for security
        parsedContent.innerHTML = data.raw_text;
        
      } catch (err) {
        console.error('Upload error:', err);
        parsedContent.innerHTML = `<span style="color: #f87171;">Failed to parse resume. Please verify the backend is active.</span>`;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Parse Resume';
      }
    });
  </script>
</body>
</html>
