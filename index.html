<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImmXrsive | Talent Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --tag-bg: rgba(99, 102, 241, 0.12);
      --tag-text: #a5b4fc;
      --border-radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      background-image: 
        radial-gradient(at 100% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(14, 165, 233, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    header {
      text-align: center;
      margin-bottom: 36px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.05rem;
    }

    .search-panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 18px 20px;
      margin-bottom: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .search-controls {
      display: flex;
      gap: 12px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    button {
      padding: 12px 24px;
      border-radius: 10px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
    }

    .talent-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: var(--border-radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .talent-card:hover {
      transform: translateY(-3px);
      border-color: rgba(99, 102, 241, 0.3);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      margin-bottom: 12px;
    }

    .talent-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .talent-headline {
      font-size: 0.9rem;
      color: #818cf8;
      font-weight: 500;
    }

    .talent-bio {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .skills-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .skill-tag {
      background: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.75rem;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid rgba(99, 102, 241, 0.2);
    }

    .state-message {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 1rem;
      grid-column: 1 / -1;
    }

    @media (max-width: 640px) {
      .search-controls {
        flex-direction: column;
      }
      button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ImmXrsive Talent</h1>
      <p>Discover skilled professionals, engineers, and creators</p>
    </header>

    <div class="search-panel">
      <div class="search-controls">
        <div class="search-input-wrap">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Search by name, role, or technical skill..."
            autocomplete="off"
          >
        </div>
        <button class="btn-primary" onclick="fetchTalent()">Search</button>
        <button class="btn-secondary" onclick="clearFilters()">Clear</button>
      </div>
    </div>

    <main id="results" class="results-grid"></main>
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');

    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        fetchTalent();
      }
    });

    async function fetchTalent() {
      const query = searchInput.value.trim();
      resultsContainer.innerHTML = '<div class="state-message">Searching directory...</div>';

      try {
        const url = query 
          ? `https://immxrsive-api.onrender.com/api/directory?q=${encodeURIComponent(query)}` 
          : 'https://immxrsive-api.onrender.com/api/directory';

        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        if (!data || data.length === 0) {
          resultsContainer.innerHTML = '<div class="state-message">No matching talent found. Try a different query.</div>';
          return;
        }

        resultsContainer.innerHTML = data.map(profile => `
          <article class="talent-card">
            <div>
              <div class="card-header">
                <h2 class="talent-name">${escapeHtml(profile.name || 'Anonymous')}</h2>
                <div class="talent-headline">${escapeHtml(profile.headline || 'Specialist')}</div>
              </div>
              <p class="talent-bio">${escapeHtml(profile.bio || 'No bio provided.')}</p>
            </div>
            <div class="skills-container">
              ${(profile.skills || []).map(skill => `
                <span class="skill-tag">${escapeHtml(skill)}</span>
              `).join('')}
            </div>
          </article>
        `).join('');
      } catch (err) {
        console.error('Fetch error:', err);
        resultsContainer.innerHTML = '<div class="state-message" style="color: #f87171;">Unable to reach directory service. Please ensure the backend is active.</div>';
      }
    }

    function clearFilters() {
      searchInput.value = '';
      fetchTalent();
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', fetchTalent);
  </script>
</body>
</html>
