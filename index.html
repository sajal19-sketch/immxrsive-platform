cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImmXrsive | Talent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --accent: #FFD700; /* Bright Yellow */
      --accent-alt: #FF69B4; /* Hot Pink */
      --border: 3px solid #000000;
      --shadow: 6px 6px 0px #000000;
      --shadow-hover: 2px 2px 0px #000000;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      min-height: 100vh;
      padding-bottom: 60px;
    }
    .navbar {
      background: var(--accent);
      border-bottom: var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      text-transform: uppercase;
    }
    .brand-main { font-size: 1.5rem; letter-spacing: -0.05em; }
    .nav-link { color: var(--text); text-decoration: none; border: var(--border); padding: 8px 16px; background: #fff; box-shadow: 3px 3px 0px #000; transition: all 0.1s; }
    .nav-link:hover { transform: translate(3px, 3px); box-shadow: 0px 0px 0px #000; }
    
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    header h1 { font-size: 3.5rem; font-weight: 700; text-transform: uppercase; letter-spacing: -0.05em; line-height: 1; margin-bottom: 16px; }
    header p { font-size: 1.1rem; font-weight: 500; border-bottom: var(--border); padding-bottom: 32px; margin-bottom: 32px; }

    .controls-bar { display: flex; gap: 16px; margin-bottom: 40px; flex-wrap: wrap; }
    input[type="text"], select {
      padding: 12px 16px; border: var(--border); background: #fff; color: var(--text); font-family: inherit; font-size: 1rem; font-weight: 500; outline: none; box-shadow: var(--shadow);
    }
    .search-input-wrap { flex: 1; min-width: 280px; }
    input[type="text"] { width: 100%; }
    input[type="text"]:focus, select:focus { background: #f0f0f0; }

    .talent-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; }
    .card {
      background: #fff; border: var(--border); padding: 24px; box-shadow: var(--shadow); transition: all 0.1s ease; display: flex; flex-direction: column; justify-content: space-between;
    }
    .card:hover { transform: translate(4px, 4px); box-shadow: var(--shadow-hover); background: #fafafa; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .talent-name { font-size: 1.5rem; font-weight: 700; text-transform: uppercase; }
    .status-badge { background: var(--accent-alt); border: var(--border); padding: 4px 8px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .talent-program { font-size: 1rem; font-weight: 700; margin-bottom: 12px; }
    .talent-headline { font-size: 1rem; font-weight: 500; margin-bottom: 24px; }
    
    .tags-container { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .tag-item { background: #eee; border: var(--border); padding: 4px 8px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    
    .btn-view-profile { width: 100%; background: var(--accent); color: var(--text); border: var(--border); padding: 12px; font-family: inherit; font-size: 1rem; font-weight: 700; text-transform: uppercase; cursor: pointer; box-shadow: 4px 4px 0px #000; transition: all 0.1s; }
    .btn-view-profile:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

    .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
    .modal-card { background: #fff; border: var(--border); box-shadow: 12px 12px 0px var(--accent); max-width: 500px; width: 100%; padding: 32px; position: relative; }
    .modal-close { position: absolute; top: 16px; right: 16px; background: var(--accent-alt); border: var(--border); font-size: 1.2rem; font-weight: 700; cursor: pointer; padding: 4px 12px; }
    .state-message { grid-column: 1 / -1; text-align: center; padding: 48px 16px; font-weight: 700; font-size: 1.2rem; text-transform: uppercase; border: var(--border); background: var(--accent); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="brand-main">ImmXrsive Directory</div>
    <a href="upload.html" class="nav-link">Add Profile</a>
  </nav>

  <div class="container">
    <header>
      <h1>Tech Talent.</h1>
      <p>Discover skilled students and alumni across tech, design, and immersive media.</p>
    </header>

    <div class="controls-bar">
      <div class="search-input-wrap">
        <input type="text" id="searchInput" placeholder="SEARCH BY NAME, SKILL..." oninput="applyClientFilters()">
      </div>
      <select id="statusFilter" onchange="applyClientFilters()">
        <option value="">ALL STATUSES</option>
        <option value="Current">CURRENT</option>
        <option value="Alumni">ALUMNI</option>
      </select>
      <select id="availabilityFilter" onchange="applyClientFilters()">
        <option value="">ALL AVAILABILITY</option>
        <option value="internship">INTERNSHIP</option>
        <option value="contract">CONTRACT</option>
        <option value="full-time">FULL-TIME</option>
      </select>
    </div>

    <main id="talentGrid" class="talent-grid"></main>
  </div>

  <div id="profileModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">X</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    let allTalent = [];
    async function loadDirectory() {
      const grid = document.getElementById('talentGrid');
      grid.innerHTML = '<div class="state-message">LOADING DATA...</div>';
      try {
        const res = await fetch('https://immxrsive-api.onrender.com/api/directory');
        if (!res.ok) throw new Error('API failed');
        allTalent = await res.json();
        applyClientFilters();
      } catch (err) { grid.innerHTML = '<div class="state-message" style="background:#ff69b4;">CONNECTION FAILED!</div>'; }
    }
    function applyClientFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedStatus = document.getElementById('statusFilter').value.toLowerCase();
      const selectedAvail = document.getElementById('availabilityFilter').value.toLowerCase();
      const filtered = allTalent.filter(item => {
        const name = (item.name || '').toLowerCase();
        const headline = (item.headline || '').toLowerCase();
        const program = (item.program || 'Computer Science').toLowerCase();
        const skills = (item.skills || []).map(s => s.toLowerCase());
        const status = (item.status || 'Current').toLowerCase();
        const availability = (item.availability || ['internship']).map(a => a.toLowerCase());
        const matchesQuery = !query || name.includes(query) || headline.includes(query) || program.includes(query) || skills.some(s => s.includes(query));
        const matchesStatus = !selectedStatus || status.includes(selectedStatus);
        const matchesAvail = !selectedAvail || availability.some(a => a.includes(selectedAvail));
        return matchesQuery && matchesStatus && matchesAvail;
      });
      renderCards(filtered);
    }
    function renderCards(list) {
      const grid = document.getElementById('talentGrid');
      if (!list || list.length === 0) { grid.innerHTML = '<div class="state-message">NO RESULTS.</div>'; return; }
      grid.innerHTML = list.map((item, index) => `
        <div class="card">
          <div>
            <div class="card-top">
              <h2 class="talent-name">${escapeHtml(item.name || 'Anonymous')}</h2>
              <span class="status-badge">${escapeHtml(item.status || 'Current')}</span>
            </div>
            <div class="talent-program">${escapeHtml(item.program || 'Computer Science')}</div>
            <div class="talent-headline">${escapeHtml(item.headline || 'Software Engineer')}</div>
            <div class="tags-container">${(item.skills || []).map(s => `<span class="tag-item">${escapeHtml(s)}</span>`).join('')}</div>
          </div>
          <button class="btn-view-profile" onclick="openModal(${index})">View Profile</button>
        </div>
      `).join('');
    }
    function openModal(index) {
      const item = allTalent[index];
      if (!item) return;
      document.getElementById('modalBody').innerHTML = `
        <h2 style="font-size: 2rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px;">${escapeHtml(item.name || 'Anonymous')}</h2>
        <div style="font-size: 1rem; font-weight: 700; margin-bottom: 24px; border-bottom: 3px solid #000; padding-bottom: 8px;">
          ${escapeHtml(item.program || 'Computer Science')} | ${escapeHtml(item.status || 'Current')}
        </div>
        <p style="font-size: 1.1rem; font-weight: 500; line-height: 1.5; margin-bottom: 24px;">
          ${escapeHtml(item.bio || item.headline || 'No description provided.')}
        </p>
        <div class="tags-container">${(item.skills || []).map(s => `<span class="tag-item">${escapeHtml(s)}</span>`).join('')}</div>
      `;
      document.getElementById('profileModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('profileModal').style.display = 'none'; }
    function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    window.addEventListener('DOMContentLoaded', loadDirectory);
  </script>
</body>
</html>
EOF
