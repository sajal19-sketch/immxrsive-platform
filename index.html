<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImmXrsive Talent Directory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --card-hover-bg: #151f32;
      --border: #1e293b;
      --border-hover: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent-badge-bg: rgba(59, 130, 246, 0.15);
      --accent-badge-text: #60a5fa;
      --tag-bg: rgba(148, 163, 184, 0.08);
      --tag-border: rgba(148, 163, 184, 0.18);
      --tag-text: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(at 100% 0%, rgba(59, 130, 246, 0.12) 0px, transparent 50%),
        radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.08) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* Top Navigation Bar */
    .navbar {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 16px 36px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-wrap {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-main {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #ffffff 40%, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 0.82rem;
      color: #38bdf8;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .nav-link {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-link:hover {
      color: #ffffff;
    }

    /* Main Container */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 40px 24px;
    }

    header {
      margin-bottom: 28px;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      gap: 14px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }

    .search-input-wrap {
      flex: 1;
      min-width: 280px;
    }

    input[type="text"], select {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #0b1120;
      font-size: 0.92rem;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
      background: #0f172a;
    }

    select option {
      background: #0f172a;
      color: #f8fafc;
    }

    .filter-dropdown-wrap {
      width: 175px;
    }

    /* Cards Grid */
    .talent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 22px;
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 240px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
      transition: all 0.2s ease;
      position: relative;
    }

    .card:hover {
      background: var(--card-hover-bg);
      border-color: rgba(59, 130, 246, 0.4);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .talent-name {
      font-size: 1.25rem;
      font-weight: 600;
      color: #ffffff;
    }

    .status-badge {
      font-size: 0.72rem;
      color: var(--accent-badge-text);
      background: var(--accent-badge-bg);
      border: 1px solid rgba(59, 130, 246, 0.25);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
    }

    .talent-program {
      font-size: 0.85rem;
      color: #38bdf8;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .talent-headline {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 18px;
    }

    .tag-item {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--tag-bg);
      border: 1px solid var(--tag-border);
      color: var(--tag-text);
      font-weight: 500;
    }

    .btn-view-profile {
      width: 100%;
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 11px;
      border-radius: 9px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-view-profile:hover {
      background: var(--primary-hover);
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(3, 7, 18, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
    }

    .modal-close {
      position: absolute;
      top: 18px;
      right: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    .state-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    @media (max-width: 680px) {
      .navbar { padding: 14px 20px; }
      .container { padding: 24px 16px; }
      .controls-bar { flex-direction: column; }
      .filter-dropdown-wrap { width: 100%; }
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="brand-wrap">
      <span class="brand-main">ImmXrsive</span>
      <span class="brand-sub">Talent Platform</span>
    </div>
    <a href="#" class="nav-link">Directory</a>
  </nav>

  <div class="container">
    <header>
      <h1>ImmXrsive Talent Directory</h1>
      <p>Discover skilled students and alumni across tech, design, and immersive media.</p>
    </header>

    <!-- Filter & Search Controls -->
    <div class="controls-bar">
      <div class="search-input-wrap">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by name, skill, program..." 
          oninput="applyClientFilters()"
        >
      </div>

      <div class="filter-dropdown-wrap">
        <select id="statusFilter" onchange="applyClientFilters()">
          <option value="">All Statuses</option>
          <option value="Current">Current Student</option>
          <option value="Alumni">Alumni</option>
        </select>
      </div>

      <div class="filter-dropdown-wrap">
        <select id="availabilityFilter" onchange="applyClientFilters()">
          <option value="">All Availability</option>
          <option value="internship">Internship</option>
          <option value="contract">Contract</option>
          <option value="full-time">Full-time</option>
        </select>
      </div>
    </div>

    <!-- Cards Grid -->
    <main id="talentGrid" class="talent-grid"></main>
  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    let allTalent = [];

    async function loadDirectory() {
      const grid = document.getElementById('talentGrid');
      grid.innerHTML = '<div class="state-message">Loading talent directory profiles...</div>';

      try {
        const res = await fetch('https://immxrsive-api.onrender.com/api/directory');
        if (!res.ok) throw new Error('API request failed');
        allTalent = await res.json();
        applyClientFilters();
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="state-message" style="color: #f87171;">Unable to connect to backend service.</div>';
      }
    }

 
function applyClientFilters() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();

  const searchMessage = document.getElementById('searchMessage');
  if (searchMessage) {
    searchMessage.textContent = query
      ? `Searching for: ${query}`
      : '';
  }

  const selectedStatus = document.getElementById('statusFilter').value.toLowerCase();
  const selectedAvail = document.getElementById('availabilityFilter').value.toLowerCase();


      const filtered = allTalent.filter(item => {
        const name = (item.name || '').toLowerCase();
        const headline = (item.headline || '').toLowerCase();
        const program = (item.program || 'Computer Science').toLowerCase();
        const bio = (item.bio || '').toLowerCase();
        const skills = (item.skills || []).map(s => s.toLowerCase());
        const status = (item.status || 'Current').toLowerCase();
        const availability = (item.availability || ['internship']).map(a => a.toLowerCase());

        const matchesQuery = !query || 
          name.includes(query) || 
          headline.includes(query) || 
          program.includes(query) || 
          bio.includes(query) || 
          skills.some(s => s.includes(query));

        const matchesStatus = !selectedStatus || status.includes(selectedStatus);
        const matchesAvail = !selectedAvail || availability.some(a => a.includes(selectedAvail));

        return matchesQuery && matchesStatus && matchesAvail;
      });

      renderCards(filtered);
    }

    function renderCards(list) {
      const grid = document.getElementById('talentGrid');
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="state-message">No profiles found matching your search.</div>';
        return;
      }

      grid.innerHTML = list.map((item, index) => {
        const status = item.status || 'Current';
        const program = item.program || 'Computer Science';
        const headline = item.headline || 'XR Developer focused on training simulations';
        const availability = item.availability || ['internship'];

        return `
          <div class="card">
            <div>
              <div class="card-top">
                <h2 class="talent-name">${escapeHtml(item.name || 'Anonymous')}</h2>
                <span class="status-badge">${escapeHtml(status)}</span>
              </div>
              <div class="talent-program">${escapeHtml(program)}</div>
              <div class="talent-headline">${escapeHtml(headline)}</div>
              <div class="tags-container">
                ${availability.map(avail => `<span class="tag-item">${escapeHtml(avail)}</span>`).join('')}
              </div>
            </div>
            <a class="btn-view-profile"    href="student.html?id=${encodeURIComponent(item.id)}">    View Profile </a>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const item = allTalent[index];
      if (!item) return;

      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <h2 style="font-size: 1.5rem; color: #ffffff; margin-bottom: 6px;">${escapeHtml(item.name || 'Anonymous')}</h2>
        <div style="color: #38bdf8; font-weight: 500; font-size: 0.9rem; margin-bottom: 14px;">
          ${escapeHtml(item.program || 'Computer Science')} &bull; ${escapeHtml(item.status || 'Current')}
        </div>
        <p style="font-size: 0.92rem; color: #94a3b8; margin-bottom: 20px; line-height: 1.6;">
          ${escapeHtml(item.bio || item.headline || 'No description available.')}
        </p>
        <div>
          <strong style="font-size: 0.85rem; color: #e2e8f0; display: block; margin-bottom: 8px;">Key Skills:</strong>
          <div class="tags-container">
            ${(item.skills || []).map(s => `<span class="tag-item">${escapeHtml(s)}</span>`).join('')}
          </div>
        </div>
      `;

      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    window.addEventListener('DOMContentLoaded', loadDirectory);
  </script>
</body>
</html>
