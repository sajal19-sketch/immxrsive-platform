cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImmXrsive | Talent Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #030712;
      --panel-bg: rgba(17, 24, 39, 0.6);
      --panel-border: rgba(31, 41, 55, 0.8);
      --accent-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      display: flex;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.05), transparent 25%),
        radial-gradient(circle at 85% 30%, rgba(139, 92, 246, 0.05), transparent 25%);
      background-attachment: fixed;
    }

    /* Sidebar Layout */
    .sidebar {
      width: 320px;
      background: rgba(3, 7, 18, 0.8);
      border-right: 1px solid var(--panel-border);
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 10;
    }

    .brand {
      margin-bottom: 48px;
    }
    .brand-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.05em;
      background: linear-gradient(to right, var(--text-main), var(--accent-cyan));
      -webkit-background-clip: text;
      color: transparent;
    }
    .brand-sub {
      font-size: 0.75rem;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      display: block;
      margin-top: 4px;
    }

    .nav-actions { margin-bottom: 40px; }
    .nav-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px;
      background: rgba(6, 182, 212, 0.1);
      border: 1px solid rgba(6, 182, 212, 0.2);
      color: var(--accent-cyan);
      text-decoration: none;
      border-radius: var(--radius);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-link:hover {
      background: var(--accent-cyan);
      color: var(--bg-base);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .filter-group { margin-bottom: 24px; }
    .filter-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: block;
    }
    input[type="text"], select {
      width: 100%;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, select:focus {
      border-color: var(--accent-cyan);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 48px;
      overflow-y: auto;
    }

    .header-stats {
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 16px;
    }
    .header-stats h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text-muted);
    }
    .match-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1;
    }
    .match-label {
      font-size: 0.8rem;
      color: var(--accent-purple);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .talent-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius);
      padding: 24px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .card:hover {
      border-color: rgba(139, 92, 246, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px -10px rgba(139, 92, 246, 0.3);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .card:hover::before { opacity: 1; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    
    .profile-id {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .monogram {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.25rem;
      color: var(--accent-purple);
    }
    .name-block h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .name-block p {
      font-size: 0.8rem;
      color: var(--accent-cyan);
    }

    .status-dot {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-dot::before {
      content: '';
      width: 6px; height: 6px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .headline {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .skills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 24px;
    }
    .skill-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      padding: 4px 8px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text-muted);
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      padding-top: 16px;
    }
    .meta-data {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .meta-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .meta-value {
      font-size: 0.85rem;
      color: var(--text-main);
    }
    
    .btn-action {
      background: transparent;
      border: none;
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn-action:hover { transform: translateX(4px); }

    /* Modal */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
    }
    .modal-card {
      background: var(--bg-base); border: 1px solid var(--accent-purple);
      border-radius: var(--radius); max-width: 500px; width: 100%; padding: 32px; position: relative;
      box-shadow: 0 0 40px rgba(139, 92, 246, 0.15);
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px; background: none; border: none;
      font-size: 1.2rem; color: var(--text-muted); cursor: pointer;
    }
    .state-message { text-align: center; color: var(--text-muted); padding: 40px; font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-name">IMM_XR_SIVE</div>
      <span class="brand-sub">Talent_Matrix</span>
    </div>

    <div class="nav-actions">
      <a href="upload.html" class="nav-link">INITIALIZE UPLOAD &rarr;</a>
    </div>

    <div class="filter-group">
      <label class="filter-label">Search Parameters</label>
      <input type="text" id="searchInput" placeholder="Name, skill, ID..." oninput="applyClientFilters()">
    </div>
    
    <div class="filter-group">
      <label class="filter-label">Operational Status</label>
      <select id="statusFilter" onchange="applyClientFilters()">
        <option value="">All Profiles</option>
        <option value="Current">Current Student</option>
        <option value="Alumni">Alumni</option>
      </select>
    </div>

    <div class="filter-group">
      <label class="filter-label">Availability Vector</label>
      <select id="availabilityFilter" onchange="applyClientFilters()">
        <option value="">Any Configuration</option>
        <option value="internship">Internship</option>
        <option value="contract">Contract</option>
        <option value="full-time">Full-time</option>
      </select>
    </div>
  </aside>

  <main class="main-content">
    <header class="header-stats">
      <h1>PUBLISHED PROFILES</h1>
      <div style="text-align: right;">
        <div id="matchCount" class="match-count">0</div>
        <div class="match-label">MATCHES DETECTED</div>
      </div>
    </header>

    <div id="talentGrid" class="talent-grid"></div>
  </main>

  <div id="profileModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    let allTalent = [];

    async function loadDirectory() {
      const grid = document.getElementById('talentGrid');
      grid.innerHTML = '<div class="state-message">ESTABLISHING CONNECTION...</div>';
      try {
        const res = await fetch('https://immxrsive-api.onrender.com/api/directory');
        if (!res.ok) throw new Error('API failed');
        allTalent = await res.json();
        applyClientFilters();
      } catch (err) {
        grid.innerHTML = '<div class="state-message" style="color: #ef4444;">CONNECTION FAILED</div>';
      }
    }

    function applyClientFilters() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const selectedStatus = document.getElementById('statusFilter').value.toLowerCase();
      const selectedAvail = document.getElementById('availabilityFilter').value.toLowerCase();

      const filtered = allTalent.filter(item => {
        const name = (item.name || '').toLowerCase();
        const headline = (item.headline || '').toLowerCase();
        const program = (item.program || 'Computer Science').toLowerCase();
        const bio = (item.bio || '').toLowerCase();
        const skills = (item.skills || []).map(s => s.toLowerCase());
        const status = (item.status || 'Current').toLowerCase();
        const availability = (item.availability || ['internship']).map(a => a.toLowerCase());

        const matchesQuery = !query || name.includes(query) || headline.includes(query) || program.includes(query) || bio.includes(query) || skills.some(s => s.includes(query));
        const matchesStatus = !selectedStatus || status.includes(selectedStatus);
        const matchesAvail = !selectedAvail || availability.some(a => a.includes(selectedAvail));

        return matchesQuery && matchesStatus && matchesAvail;
      });
      
      document.getElementById('matchCount').textContent = filtered.length.toString().padStart(2, '0');
      renderCards(filtered);
    }

    function renderCards(list) {
      const grid = document.getElementById('talentGrid');
      if (!list || list.length === 0) {
        grid.innerHTML = '<div class="state-message">NO MATCHING DATA FOUND</div>';
        return;
      }

      grid.innerHTML = list.map((item, index) => {
        const name = item.name || 'Anonymous';
        const initial = name.charAt(0).toUpperCase();
        const status = item.status || 'Current';
        const program = item.program || 'Computer Science';
        const headline = item.headline || 'Software Engineer';
        const availability = item.availability || ['internship'];
        
        let statusColor = status.toLowerCase() === 'alumni' ? '#f59e0b' : '#10b981';

        return `
          <div class="card" onclick="openModal(${index})">
            <div class="card-header">
              <div class="profile-id">
                <div class="monogram">${initial}</div>
                <div class="name-block">
                  <h2>${escapeHtml(name)}</h2>
                  <p>${escapeHtml(program)}</p>
                </div>
              </div>
              <div class="status-dot" style="color: ${statusColor}; --tw-shadow-color: ${statusColor};">${escapeHtml(status)}</div>
            </div>
            
            <div class="headline">${escapeHtml(headline)}</div>
            
            <div class="skills-row">
              ${(item.skills || []).map(s => `<span class="skill-tag">${escapeHtml(s)}</span>`).join('')}
            </div>
            
            <div class="card-footer">
              <div class="meta-data">
                <span class="meta-label">Availability</span>
                <span class="meta-value">${escapeHtml(availability[0] || 'Open')}</span>
              </div>
              <button class="btn-action">&nearr;</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const item = allTalent[index];
      if (!item) return;

      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <h2 style="font-size: 1.5rem; margin-bottom: 4px;">${escapeHtml(item.name || 'Anonymous')}</h2>
        <div style="color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin-bottom: 16px;">
          ${escapeHtml(item.program || 'Computer Science')} | SYSTEM_STATUS: ${escapeHtml(item.status || 'Current')}
        </div>
        <p style="font-size: 0.9rem; line-height: 1.6; margin-bottom: 24px; color: var(--text-muted);">
          ${escapeHtml(item.bio || item.headline || 'No telemetry provided.')}
        </p>
      `;
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeModal(e) { if(e) e.stopPropagation(); document.getElementById('profileModal').style.display = 'none'; }
    function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;'); }
    
    window.addEventListener('DOMContentLoaded', loadDirectory);
  </script>
</body>
</html>
EOF
