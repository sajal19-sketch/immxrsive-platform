<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Employer inquiry · ImmXrsive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="progress" id="progress" aria-hidden="true"></div>

<div class="page">
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html" aria-label="ImmXrsive, home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke-linecap="round"/><g fill="currentColor"><rect x="10.5" y="2.6" width="3" height="2.2" rx=".5"/><rect x="10.5" y="19.2" width="3" height="2.2" rx=".5"/><rect x="2.6" y="10.9" width="2.2" height="3" rx=".5"/><rect x="19.2" y="10.9" width="2.2" height="3" rx=".5"/></g></svg>
        ImmXrsive
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a class="hide-sm" href="index.html#field">The field</a>
        <a href="index.html#index">Index</a>
        <a href="upload.html">Upload</a>
        <a class="cta" href="intake.html">Inquire</a>
        <a href="login.html" style="background: #004b87; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; margin-left: 10px;">Algoma Login</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="chapter sub">
      <div class="wrap">
        <p class="ch-label"><b>Employer</b>Inquiry</p>
        <h2>Open a <em>channel.</em></h2>
        <p class="sub-copy">Tell us who you are and what you are hiring for. We will pass it on.</p>

        <p class="about-line" id="about" style="margin-top:30px">Inquiry about: <b>General inquiry</b></p>

        <form class="formbox" id="form" novalidate>
          <input type="hidden" id="source_id" name="source_id" value="">
          <div class="hp" aria-hidden="true"><label>Leave this empty<input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
          <label class="f"><span>Your name</span><input class="ctl" id="name" name="name" maxlength="80" autocomplete="name"></label>
          <label class="f"><span>Company</span><input class="ctl" id="company" name="company" maxlength="100" autocomplete="organization"></label>
          <label class="f"><span>Work email</span><input class="ctl" id="email" name="email" type="email" maxlength="120" autocomplete="email"></label>
          <label class="f"><span>Role type</span>
            <select class="control" id="role" name="role_type">
              <option value="">Select one</option>
              <option>Internship</option>
              <option>Contract</option>
              <option>Full-time</option>
            </select>
          </label>
          <label class="f"><span>Message</span><textarea class="ctl ta" id="message" name="message" maxlength="1000"></textarea></label>
          <p class="form-msg" id="msg" aria-live="polite"></p>
          <button class="btn inline" id="send" type="submit">Send inquiry</button>
        </form>

        <div><a class="back" href="index.html#index">Back to the talent index</a></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><span>ImmXrsive · Endurance Mission Control</span><span>Profiles load from the ImmXrsive directory API</span></div>
  </footer>
</div>

<script src="site.js"></script>
<script>
(function () {
  "use strict";
  var X = window.IMX, $ = X.$, el = X.el, lc = X.lc;

  // Inquiries are stored by the ImmXrsive API (issue #11). Success is shown only
  // after the server confirms it saved the inquiry.
  var INQUIRY_URL = "https://immxrsive-api.onrender.com/api/inquiries";

    // Inquiry context: source_type, source_id, source_name, source_url (R1.18, R1.19).
  var params = new URLSearchParams(window.location.search);
  var raw = params.get("source_id");
  var sourceId = (raw && /^[A-Za-z0-9_-]{1,64}$/.test(raw)) ? raw : "";
  var sourceType = sourceId ? (params.get("source_type") === "project" ? "project" : "student") : "";
  var sourceName = "";
  var sourceUrl = sourceId ? location.href.split("intake.html")[0] + (sourceType === "project" ? "project.html?id=" : "student.html?id=") + encodeURIComponent(sourceId) : "";
  $("source_id").value = sourceId;

  var about = $("about");
  function setAbout(text) {
    about.replaceChildren(document.createTextNode("Inquiry about: "), el("b", null, text));
  }
  if (!sourceId) {
    setAbout("General inquiry");
  } else if (sourceType === "project") {
    sourceName = (params.get("source_name") || "").slice(0, 150);
    setAbout("Project: " + (sourceName || sourceId));
    fetch("https://immxrsive-api.onrender.com/api/projects/" + encodeURIComponent(sourceId))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (pr) { if (pr && pr.title) { sourceName = pr.title; setAbout("Project: " + pr.title); } })
      .catch(function () {});
  } else {
    setAbout(sourceId.toUpperCase());
    X.loadDirectory().then(function (res) {
      var p = res.data.filter(function (x) { return lc(x.id) === lc(sourceId); })[0];
      if (p) { sourceName = p.name; setAbout(p.name + " (" + p.id.toUpperCase() + ")"); document.title = "Inquiry about " + p.name + " · ImmXrsive"; }
    });
  }
  function msg(text, cls) { var m = $("msg"); m.textContent = text; m.className = "form-msg" + (cls ? " " + cls : ""); }

  $("form").addEventListener("submit", function (e) {
    e.preventDefault();
    if ($("website").value) return; // honeypot: bots fill this in, people never see it
    var d = {
            source_type: sourceType,
      source_id: sourceId,
      source_name: sourceName,
      source_url: sourceUrl,
      name: $("name").value.trim(),
      company: $("company").value.trim(),
      email: $("email").value.trim(),
      role_type: $("role").value,
      message: $("message").value.trim()
    };
    if (!d.name) return msg("Add your name.", "err");
    if (!d.company) return msg("Add your company.", "err");
    if (!/^\S+@\S+\.\S+$/.test(d.email)) return msg("Enter a valid email address.", "err");
    if (!d.message) return msg("Add a short message.", "err");

    var btn = $("send"); btn.disabled = true; msg("Sending. The server may take up to a minute to wake up.", "");
    var body = {
      source_type: d.source_type, source_id: d.source_id, name: d.name, company: d.company,
      email: d.email, role_type: d.role_type, message: d.message, website: $("website").value
    };
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 70000);
    fetch(INQUIRY_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal: ctrl.signal })
      .then(function (res) {
        clearTimeout(timer);
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) {
            var detail = data && data.detail;
            var e = new Error(typeof detail === "string" ? detail : "Couldn't send your inquiry. Try again in a moment.");
            e.fromServer = true;
            throw e;
          }
          $("form").reset(); btn.disabled = false;
          msg("Sent. ImmXrsive staff received your inquiry" + (d.source_name ? " about " + d.source_name : "") + " and will follow up by email.", "ok");
          X.toast("Inquiry sent to ImmXrsive staff.");
          document.dispatchEvent(new CustomEvent("inquiry:submit", { detail: d }));
        });
      })
      .catch(function (err) {
        clearTimeout(timer);
        btn.disabled = false;
        msg(err && err.fromServer ? err.message : "Couldn't reach the server, so your inquiry was not sent. Check your connection and try again.", "err");
      });
  });
})();
</script>
</body>
</html>
