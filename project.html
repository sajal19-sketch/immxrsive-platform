<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Project · ImmXrsive</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<style>
  .pj{max-width:900px}
  .pj h1{font-size:clamp(30px,6vw,56px);line-height:1.05;margin:14px 0 10px;overflow-wrap:anywhere}
  .pj-meta{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
  .pj-desc{white-space:pre-line;color:#cfccc2;max-width:68ch;overflow-wrap:anywhere}
  .pj-sec{margin-top:40px}
  .pj-sec h2{font:11.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
  .pj-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .pj-note{color:var(--muted);font-size:14px;margin:12px 0 0}
  .pj-fallback{margin:18px 0 0;border:1px solid var(--line);border-radius:3px;padding:12px;background:rgba(7,10,20,.82)}
  .pj-fallback img{display:block;width:100%;height:auto;max-height:460px;object-fit:contain;background:#05070d}
  .pj-fallback figcaption{color:var(--muted);font-size:14px;margin-top:10px;overflow-wrap:anywhere}
  .pj-contrib .ev h3 a{text-decoration:underline;text-underline-offset:4px}
  .pj-statement{white-space:pre-line;overflow-wrap:anywhere}
  .pj-state{padding:60px 0}
  .tags{display:flex;flex-wrap:wrap;gap:8px}
  .tags .tag{white-space:normal;overflow-wrap:anywhere}
  .pj-verified{display:inline-block;margin:0 0 10px;padding:6px 12px;border:1px solid #5db7d9;border-radius:999px;color:#9fdcf2;font:12px var(--mono);letter-spacing:.06em}
  .pj-partners{margin:0 0 14px;color:#cfccc2}
  .pj-partners a{text-decoration:underline;text-underline-offset:4px}
</style>
</head>
<body>
<div class="page">
<header class="nav"><div class="wrap"><a class="logo" href="index.html">ImmXrsive</a>
<nav class="nav-links keep" aria-label="Primary"><a href="index.html">Directory</a><a href="projects.html">My Projects</a><a href="partners.html">Partners</a><a class="cta" href="intake.html">Inquire</a></nav></div></header>
<main class="chapter sub"><div class="wrap pj">
  <a href="index.html" id="back" class="pj-note">← Back to directory</a>
  <div id="content" aria-live="polite"><p class="pj-state">Loading project…</p></div>
</div></main>
</div>
<script>
(function () {
  "use strict";
  var API = window.IMX_API;
  var root = document.getElementById("content");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  // Only https links are ever placed in href/src (no javascript:, data:, etc.).
  function safeHttps(u) {
    try { var x = new URL(String(u || "")); return x.protocol === "https:" ? x.href : ""; } catch (e) { return ""; }
  }
  function extLink(label, url, cls) {
    var a = el("a", cls || "btn inline", label);
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    return a;
  }
  function section(title, body) {
    var s = el("section", "pj-sec");
    s.appendChild(el("h2", null, title));
    s.appendChild(body);
    return s;
  }
  function state(title, text) {
    root.replaceChildren();
    var box = el("div", "pj-state");
    box.appendChild(el("h1", null, title));
    box.appendChild(el("p", "pj-desc", text));
    var a = el("a", "btn inline", "Browse the directory"); a.href = "index.html";
    box.appendChild(a);
    root.appendChild(box);
  }

  function render(p) {
    document.title = p.title + " · ImmXrsive";
    root.replaceChildren();
    root.appendChild(el("h1", null, p.title));
    var meta = el("div", "pj-meta");
    [p.domain, p.status, p.project_date].forEach(function (m) { if (m) meta.appendChild(el("span", "tag", m)); });
    root.appendChild(meta);
    var industry = el("div"); root.appendChild(industry);   // filled by loadIndustry (R4)
    root.appendChild(el("p", "pj-desc", p.description || "No description yet."));

    // ---- Demo / evidence (R3.19-R3.22, Final F.29 and F.33-F.38)
    // Nothing heavy loads with the page: no iframe, video or runtime until the
    // visitor presses Launch. Embedded builds run in a sandboxed frame without
    // same-origin access, so they cannot read this site's session or act as the
    // visitor. Camera/mic/XR permissions are only delegated to a WebXR build, and
    // only at launch time.
    var play = safeHttps(p.playable_url), video = safeHttps(p.video_url), fb = safeHttps(p.fallback_url);
    var replacement = safeHttps(p.demo_replacement_url);
    var repos = (p.repo_urls || []).map(safeHttps).filter(Boolean);
    var state = p.demo_state || "available", type = p.demo_type || "link";
    var evidence = el("div");
    var fallbackFig = null;
    function fallback() {
      if (fallbackFig) return fallbackFig;
      fallbackFig = el("figure", "pj-fallback");
      if (fb) {
        var img = document.createElement("img");
        img.src = fb; img.alt = p.fallback_text || ("Preview of " + p.title); img.loading = "lazy"; img.decoding = "async";
        img.onerror = function () {
          var alt = el("p", "pj-note", "Preview image could not be loaded. ");
          alt.appendChild(extLink("Open preview link", fb, ""));
          img.replaceWith(alt);
        };
        fallbackFig.appendChild(img);
      }
      fallbackFig.appendChild(el("figcaption", null, p.fallback_text || (fb ? "Project preview" : "No preview image was provided. The description and contributors above describe the project.")));
      return fallbackFig;
    }
    if (play && state !== "available") {
      var msg = { unavailable: "The playable demo is temporarily unavailable.", archived: "This demo has been archived and is no longer playable.",
                  replaced: "This demo was replaced by a newer build." }[state] || "The demo is not available.";
      var n = el("div", "notice warn");
      n.appendChild(el("p", null, msg + (p.demo_note ? " " + p.demo_note : "")));
      if (state === "replaced" && replacement) n.appendChild(extLink("Open the new build", replacement));
      evidence.appendChild(n);
    }
    var actions = el("div", "pj-actions");
    var stageHost = el("div");
    if (play && state === "available") {
      if (type === "link") {
        actions.appendChild(extLink("▶ Play Demo (opens a new tab)", play));
      } else {
        var launch = el("button", "btn inline", type === "webxr" ? "▶ Launch WebXR demo" : "▶ Launch demo");
        launch.type = "button";
        launch.setAttribute("aria-describedby", "demo-help");
        launch.onclick = function () { launchDemo(play, type, stageHost, launch); };
        actions.appendChild(launch);
        actions.appendChild(extLink("Open in a new tab", play, "btn inline ghost"));
      }
    }
    if (video) actions.appendChild(extLink("Watch Demo Video", video, "btn inline ghost"));
    repos.forEach(function (r, i) { actions.appendChild(extLink(repos.length > 1 ? "View Source " + (i + 1) : "View Source", r, "btn inline ghost")); });
    if (actions.children.length) evidence.appendChild(actions);
    if (play && state === "available" && type !== "link") {
      var help = el("p", "pj-note", "The demo starts only when you press Launch. It runs in an isolated frame; press Close demo or Escape to leave it.");
      help.id = "demo-help"; evidence.appendChild(help);
    }
    evidence.appendChild(stageHost);
    if (fb || p.fallback_text || (play && state !== "available")) evidence.appendChild(fallback());
    if (!evidence.children.length || (evidence.children.length === 1 && evidence.firstChild === stageHost))
      evidence.appendChild(el("p", "pj-note", "No demo, video or source link has been added for this project."));
    root.appendChild(section("Try it / evidence", evidence));

    function launchDemo(url, kind, host, opener) {
      function open() {
        host.replaceChildren();
        var stage = el("div", "demo-stage");
        stage.setAttribute("role", "region"); stage.setAttribute("aria-label", "Playable demo");
        var bar = el("div", "demo-bar");
        var status = el("span", "pj-note", "Loading demo…"); status.setAttribute("aria-live", "polite");
        var right = el("div", "pj-actions");
        var trouble = el("button", "btn inline ghost", "Not working? Show preview"); trouble.type = "button";
        var close = el("button", "btn inline", "Close demo"); close.type = "button";
        right.appendChild(trouble); right.appendChild(close);
        bar.appendChild(status); bar.appendChild(right); stage.appendChild(bar);
        var frame = document.createElement("iframe");
        frame.title = "Playable demo for " + p.title;
        frame.setAttribute("sandbox", "allow-scripts allow-pointer-lock");
        frame.referrerPolicy = "no-referrer";
        frame.setAttribute("allow", kind === "webxr" ? "xr-spatial-tracking; fullscreen; camera; microphone; gyroscope; accelerometer" : "fullscreen");
        var loaded = false;
        var slow = setTimeout(function () { if (!loaded) status.textContent = "This demo is taking a long time to load. You can keep waiting, open it in a new tab, or close it."; }, 15000);
        frame.onload = function () { loaded = true; clearTimeout(slow); status.textContent = "Demo running. If it shows an error page, the build may be broken; use Close demo."; };
        frame.onerror = function () { status.textContent = "The demo could not be loaded."; };
        frame.src = url;
        stage.appendChild(frame);
        host.appendChild(stage);
        function shut(showFallback) {
          clearTimeout(slow);
          frame.src = "about:blank"; host.replaceChildren();
          document.removeEventListener("keydown", esc);
          if (showFallback) { var f = fallback(); if (!f.isConnected) host.appendChild(f); f.scrollIntoView({ block: "nearest" }); }
          opener.focus();
        }
        function esc(e) { if (e.key === "Escape") shut(false); }
        document.addEventListener("keydown", esc);
        close.onclick = function () { shut(false); };
        trouble.onclick = function () { shut(true); };
        close.focus();
      }
      if (kind === "webxr") {
        var check = navigator.xr && navigator.xr.isSessionSupported ? navigator.xr.isSessionSupported("immersive-vr").catch(function () { return false; }) : Promise.resolve(false);
        check.then(function (ok) {
          if (ok) return open();
          host.replaceChildren();
          var n = el("div", "notice warn");
          n.appendChild(el("p", null, "This browser or device can't run the immersive (WebXR) version of this demo. Here is the project preview instead."));
          var anyway = el("button", "btn inline ghost", "Try the browser version anyway"); anyway.type = "button";
          anyway.onclick = open; n.appendChild(anyway);
          host.appendChild(n);
          var f = fallback(); if (!f.isConnected) host.appendChild(f);
          anyway.focus();
        });
      } else open();
    }

    // ---- Contributors and roles (R3.15)
    var grid = el("div", "ev-grid pj-contrib");
    (p.contributors || []).forEach(function (c) {
      var card = el("article", "ev");
      card.appendChild(el("span", "meta", c.role + (c.is_maintainer ? " · Maintainer" : "")));
      var h = el("h3");
      if (c.student_id) { var a = el("a", null, c.name); a.href = "student.html?id=" + encodeURIComponent(c.student_id); h.appendChild(a); }
      else h.textContent = c.name;
      card.appendChild(h);
      if (c.statement) card.appendChild(el("p", "pj-statement", c.statement));
      grid.appendChild(card);
    });
    root.appendChild(section("Contributors and roles", grid.children.length ? grid : el("p", "pj-note", "No public contributors yet.")));

    // ---- Technologies are project-level, not personal skills (R3.14)
    var tech = el("div");
    var tags = el("div", "tags");
    (p.technologies || []).forEach(function (t) { tags.appendChild(el("span", "tag", t)); });
    tech.appendChild(tags.children.length ? tags : el("p", "pj-note", "None listed."));
    tech.appendChild(el("p", "pj-note", "These describe the project. Each contributor's personal skills are on their own profile."));
    root.appendChild(section("Project technologies", tech));

    loadIndustry(p.id, industry);

    var inquiry = el("a", "btn inline", "Inquire about this project");
    inquiry.href = "intake.html?source_type=project&source_id=" + encodeURIComponent(p.id) + "&source_name=" + encodeURIComponent(p.title);
    var wrap = el("div", "pj-actions"); wrap.appendChild(inquiry);
    root.appendChild(section("Interested?", wrap));
  }

  // ---- Release 4: official verification and approved industry partners (set by staff only)
  function loadIndustry(pid, box) {
    fetch(API + "/api/projects/" + encodeURIComponent(pid) + "/industry")
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d) return;
        if (d.official_verified) {
          var v = el("p", "pj-verified", "✓ Officially verified by ImmXrsive");
          if (d.verified_at) v.title = "Verified " + new Date(d.verified_at).toLocaleDateString();
          box.appendChild(v);
        }
        if (d.partners.length) {
          var row = el("p", "pj-partners");
          row.appendChild(document.createTextNode("Industry partner" + (d.partners.length > 1 ? "s" : "") + ": "));
          d.partners.forEach(function (c, i) {
            if (i) row.appendChild(document.createTextNode(", "));
            var a = el("a", null, c.name); a.href = "partner.html?id=" + encodeURIComponent(c.id); row.appendChild(a);
          });
          box.appendChild(row);
        }
      }).catch(function () {});
  }

  var id = new URLSearchParams(location.search).get("id") || "";
  if (document.referrer && document.referrer.indexOf(location.host) !== -1) {
    var back = document.getElementById("back");
    back.textContent = "← Back"; back.href = "#";
    back.onclick = function (e) { e.preventDefault(); history.back(); };
  }
  if (!/^[A-Za-z0-9_-]{1,64}$/.test(id)) { state("Project not found", "This link does not point to a public project."); return; }

  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 45000);
  fetch(API + "/api/projects/" + encodeURIComponent(id), { signal: ctrl.signal })
    .then(function (r) {
      clearTimeout(timer);
      if (r.status === 404) { state("Project not found", "This project does not exist or is not public."); return null; }
      if (!r.ok) throw new Error("bad status");
      return r.json();
    })
    .then(function (p) { if (p) render(p); })
    .catch(function () { state("Could not load this project", "The server may be waking up. Wait a moment and refresh the page."); });
})();
</script>
</body>
</html>
