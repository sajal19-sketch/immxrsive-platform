<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crew file · ImmXrsive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="progress" id="progress" aria-hidden="true"></div>

<div class="page">
  <header class="nav">
    <div class="wrap">
      <a class="logo" href="index.html" aria-label="ImmXrsive, home">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke-linecap="round"/><g fill="currentColor"><rect x="10.5" y="2.6" width="3" height="2.2" rx=".5"/><rect x="10.5" y="19.2" width="3" height="2.2" rx=".5"/><rect x="2.6" y="10.9" width="2.2" height="3" rx=".5"/><rect x="19.2" y="10.9" width="2.2" height="3" rx=".5"/></g></svg>
        ImmXrsive
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a class="hide-sm" href="index.html#field">The field</a>
        <a href="index.html#index">Index</a>
        <a href="upload.html">Upload</a>
        <a class="cta" href="intake.html">Inquire</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="chapter sub">
      <div class="wrap">
        <p class="ch-label"><b>Crew file</b><span id="crew-id"></span></p>
        <div id="banner" class="banner" hidden></div>
        <div id="profile" aria-live="polite" aria-busy="true"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><span>ImmXrsive · Endurance Mission Control</span><span>Profiles load from the ImmXrsive directory API</span></div>
  </footer>
</div>

<script src="site.js"></script>
<script>
(function () {
  "use strict";
  var X = window.IMX;
  var $ = X.$, el = X.el;
  var root = $("profile"), banner = $("banner");
  var id = new URLSearchParams(window.location.search).get("id");
  var API = "https://immxrsive-api.onrender.com";
  var controller = new AbortController();
  var timeout = setTimeout(function () { controller.abort(); }, 45000);
  var slow = setTimeout(function () {
    banner.textContent = "Waking up the live directory API. The first request may take longer on free hosting.";
    banner.hidden = false;
  }, 4000);

  function finish() {
    clearTimeout(timeout);
    clearTimeout(slow);
    banner.hidden = true;
    root.setAttribute("aria-busy", "false");
  }
  function state(title, message) {
    finish();
    document.body.dataset.portfolioTheme = "stellar";
    var box = el("div", "state");
    box.appendChild(el("h3", null, title));
    box.appendChild(el("p", null, message));
    var a = el("a", "btn", "Back to the index");
    a.href = "index.html#index";
    a.style.marginTop = "22px";
    box.appendChild(a);
    root.replaceChildren(box);
  }
  function section(title, node) {
    var s = el("section", "m-sec");
    s.appendChild(el("h4", null, title));
    s.appendChild(node);
    return s;
  }
  function safeHttps(raw) {
    try {
      var u = new URL(raw);
      return u.protocol === "https:" && !u.username && !u.password ? u.href : "";
    } catch (_) { return ""; }
  }
  function list(value) { return Array.isArray(value) ? value : []; }
  function profileTheme(value) {
    return ["stellar", "nebula", "minimal"].includes(value) ? value : "stellar";
  }
  function showProfile(p) {
    finish();
    document.title = (p.name || "Student") + " · ImmXrsive";
    $("crew-id").textContent = String(p.id || id).toUpperCase();
    document.body.dataset.portfolioTheme = profileTheme(p.theme);
    root.replaceChildren();

    var back = el("a", "back", "Back to the talent index");
    back.href = "index.html#index";
    back.style.marginTop = "0";
    root.appendChild(back);

    var head = el("div", "pf-head");
    var imageUrl = safeHttps(p.hero_media);
    if (imageUrl) {
      var img = document.createElement("img");
      img.className = "pf-hero-image";
      img.src = imageUrl;
      img.alt = "Profile hero image for " + (p.name || "student");
      img.loading = "lazy";
      img.referrerPolicy = "no-referrer";
      img.onerror = function () { img.replaceWith(X.constellation(p, 120)); };
      head.appendChild(img);
    } else {
      head.appendChild(X.constellation(p, 120));
    }
    var intro = el("div", "pf-intro");
    intro.appendChild(el("span", "badge" + (String(p.status || "").toLowerCase() === "current" ? " current" : ""), p.status || "Student"));
    intro.appendChild(el("h1", "pf-name", p.name || "Student"));
    if (p.program) intro.appendChild(el("p", "program", p.program));
    if (p.headline) intro.appendChild(el("p", "pf-headline", p.headline));
    head.appendChild(intro);
    root.appendChild(head);

    var actions = el("div", "pf-actions");
    var inquire = el("a", "btn inline", "Employer Inquiry");
    inquire.href = X.intakeUrl(p.id);
    actions.appendChild(inquire);
    root.appendChild(actions);

    var stack = el("div", "pf-stack");
    stack.style.marginTop = "40px";
    var bio = el("p", null, p.bio || "This profile doesn't have a bio yet.");
    bio.style.whiteSpace = "pre-line";
    stack.appendChild(section("About", bio));

    var skills = list(p.skills);
    var skillTags = el("div", "tags");
    X.fillTags(skillTags, skills);
    stack.appendChild(section("Skills", skills.length ? skillTags : el("p", null, "No skills listed.")));

    var availability = list(p.availability);
    if (availability.length) {
      var availabilityTags = el("div", "tags");
      X.fillTags(availabilityTags, availability);
      stack.appendChild(section("Open to", availabilityTags));
    }

    // The public detail API currently supplies project_ids / project_count,
    // not full project objects. Link by published IDs without inventing content.
    var projectIds = list(p.project_ids);
    if (projectIds.length) {
      var projectLinks = el("div", "tags");
      projectIds.forEach(function (projectId) {
        if (!X.validId(projectId)) return;
        var a = el("a", "tag", projectId);
        a.href = "project.html?id=" + encodeURIComponent(projectId);
        projectLinks.appendChild(a);
      });
      if (projectLinks.children.length) stack.appendChild(section("Projects", projectLinks));
    } else if (list(p.projects).length) {
      var projectList = el("div", "ev-grid");
      p.projects.forEach(function (pr) {
        var card = el("article", "ev");
        if (pr && pr.role) card.appendChild(el("span", "meta", pr.role));
        card.appendChild(el("h3", null, pr && pr.title || "Untitled project"));
        if (pr && pr.summary) card.appendChild(el("p", null, pr.summary));
        projectList.appendChild(card);
      });
      stack.appendChild(section("Projects", projectList));
    }

    var order = Array.isArray(p.section_order) &&
      p.section_order.length === 2 &&
      p.section_order.includes("education") && p.section_order.includes("experience")
      ? p.section_order : ["education", "experience"];
    order.forEach(function (key) {
      if (!p[key]) return;
      var paragraph = el("p", null, String(p[key]));
      paragraph.style.whiteSpace = "pre-line";
      stack.appendChild(section(key === "education" ? "Education" : "Experience", paragraph));
    });

    var links = el("div", "tags");
    [["GitHub", p.github_link], ["LinkedIn", p.linkedin_link], ["Portfolio", p.portfolio_link]].forEach(function (entry) {
      var url = safeHttps(entry[1]);
      if (!url) return;
      var a = el("a", "tag", entry[0]);
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      links.appendChild(a);
    });
    if (links.children.length) stack.appendChild(section("Professional links", links));
    root.appendChild(stack);
  }

  if (!id) { state("No profile selected", "Open a profile from the talent index."); return; }
  if (!X.validId(id)) { state("Invalid profile id", "Open a valid profile from the talent index."); return; }
  $("crew-id").textContent = id.toUpperCase();

  // Public access is verified by the backend on every page load. Never use
  // cached directory data or sample fallback for an individual student page.
  fetch(API + "/api/students/" + encodeURIComponent(id), {
    headers: { "Accept": "application/json" },
    cache: "no-store",
    signal: controller.signal
  }).then(function (response) {
    if (response.status === 404) {
      state("Profile not found", "This student profile is unavailable or unpublished.");
      return null;
    }
    if (!response.ok) throw new Error("API returned HTTP " + response.status);
    return response.json();
  }).then(function (profile) {
    if (profile) showProfile(profile);
  }).catch(function () {
    state("Profile temporarily unavailable", "Could not load this profile from the live API. Please try again.");
  });
})();
</script>
</body>
</html>
